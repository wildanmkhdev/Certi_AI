name: Worker Cron - Trigger Every 5 Minutes

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  trigger-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    
    steps:
      - name: Trigger Worker API
        run: |
          echo "Triggering worker at $(date)"
          
          # Try to trigger worker via POST
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.PRODUCTION_URL }}/api/worker" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 10)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Worker triggered successfully"
          else
            echo "⚠️ Worker trigger returned status $HTTP_CODE"
            exit 1
          fi
      
      - name: Report Status
        if: always()
        run: |
          echo "Worker cron job completed at $(date)"
